[project]
name = "urep"
version = "0.0.0+dev"
description = "uRep — micro replication for configuration files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.3",
    "pydantic>=2.7",
    "inotify_simple>=1.3.3",
    "structlog>=24.1",
    "cryptography>=42.0",
    "cbor2>=5.6",
]

[project.scripts]
urep = "urep.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast tests without network",
    "integration: multi-node cluster in Docker",
    "chaos: partition / kill -9 / clock skew (NET_ADMIN)",
    "multicast: requires host network",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/urep/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
